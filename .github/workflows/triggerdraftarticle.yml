name: Trigger daily article draft

# The drafting workflow (draft-article.yml) only accepts workflow_dispatch, so this workflow
# is the plain-Actions half: it reacts to a push touching config/experience-log.md and
# dispatches draft-article.yml.
#
# Merging a draft's PR brings that PR's own experience-log.md edit (today's entry moved to
# Referenced) into main, which matches the path filter below. The `if:` below skips dispatching
# when the push is itself a draft/* merge. Squash-merge messages don't have a reliably
# matchable pattern, so for that merge strategy the hard gate in draft-article.yml's prompt is
# the only guard (it exits immediately, just wasting one run).

on:
  push:
    branches: [main]
    paths:
      - 'config/experience-log.md'

permissions:
  actions: write

jobs:
  dispatch:
    if: >-
      !(startsWith(github.event.head_commit.message, 'Merge pull request') &&
      contains(github.event.head_commit.message, 'draft/')) &&
      !startsWith(github.event.head_commit.message, 'Draft: ')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch draft-article.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run draft-article.yml \
            --repo "${{ github.repository }}" \
            --ref main
