name: Update LinkedIn queue

on:
  schedule:
    - cron: '30 4 * * 1' # Mondays, 10:00 IST: catches articles whose merge-time draft failed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be added without writing the queue file'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: linkedin-backfill

jobs:
  update-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Add missing articles to social/linkedin-queue.md
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: npx tsx scripts/linkedin-backfill.ts

      - name: Commit the queue
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          [ -e social ] || exit 0
          git config user.name "architecture-journal-bot"
          git config user.email "articles-bot@users.noreply.github.com"
          git add social
          git diff --cached --quiet && exit 0
          git commit -m "Update LinkedIn queue"
          git pull --rebase origin main
          git push origin main
