name: Create a LinkedIn draft for a published article

on:
  schedule:
    - cron: '30 4 * * 2,4' # Tue + Thu, 10:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the candidate post without creating the LinkedIn draft'
        type: boolean
        default: true
      all:
        description: 'Draft every article not yet on LinkedIn in one run (instead of one)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-backfill

jobs:
  post-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Draft the oldest article not yet on LinkedIn
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          BACKFILL_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: npx tsx scripts/linkedin-backfill.ts

      - name: Commit the posted marker
        if: always()
        run: |
          git config user.name "architecture-journal-bot"
          git config user.email "articles-bot@users.noreply.github.com"
          git add published
          git diff --cached --quiet && exit 0
          git commit -m "Mark article as posted to LinkedIn"
          git pull --rebase origin main
          git push origin main
