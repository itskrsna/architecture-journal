name: Draft daily article

# Replaces both the old Claude Code cloud routine (broken — see CLAUDE.md history) and the
# short-lived Anthropic-API-key version of this workflow (too costly for a personal project).
# This version runs Claude Code itself, inside the Action, authenticated with a subscription
# OAuth token (`claude setup-token`, stored as CLAUDE_CODE_OAUTH_TOKEN) instead of a metered
# API key — so usage draws from the Claude subscription's allowance, not separate billing.
# Git/PR operations use the job's own GITHUB_TOKEN, same as handle-review.yml already does.
#
# `anthropics/claude-code-action` rejects a plain `push` trigger outright at runtime
# ("Unsupported event type: push") — confirmed by an actual failed run, not just
# under-documented. `workflow_dispatch` is confirmed working (a manual "Run workflow" run
# succeeded). So this workflow ONLY listens for workflow_dispatch; the actual "run when today's
# experience-log entry gets pushed" trigger lives in trigger-draft-article.yml, a plain
# push-triggered workflow (no claude-code-action in it, so the whitelist never applies) that
# dispatches this one via `gh workflow run`. See that file for the other half.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this, the action uses its own bundled Claude GitHub App identity for all
          # git/PR operations, so PRs show up as opened by claude[bot]. This forces it to use
          # the job's plain GITHUB_TOKEN instead, same as handle-review.yml already does —
          # PRs now show as opened by github-actions[bot] instead.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action's own bot_name/bot_id (default claude[bot] / 41898282) control the git
          # identity it uses for commits, overriding whatever `git config user.name` the prompt
          # sets — this is what was still showing claude[bot] on the commit itself even after
          # the github_token fix above resolved the PR's "opened by" attribution.
          bot_name: architecture-journal-bot
          # This workflow is only ever dispatched by trigger-draft-article.yml (itself only
          # reachable via a push gated on repo write access), so a bot-identity actor here is
          # expected and safe to allow, not a sign of some unrelated automated trigger.
          allowed_bots: "*"
          claude_args: |
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch"
          prompt: |
            You are the daily drafting step of a personal tech-article publishing pipeline.
            You are already checked out in a local clone of
            https://github.com/itskrsna/architecture-journal on its default branch — treat the
            repository root as your working directory for everything below. Git push and GitHub
            operations work directly (the job's GITHUB_TOKEN is already wired up as GH_TOKEN for
            `gh`, and git push is already authorized) — no token handling needed.

            Read config/profile.md, config/topics-queue.json, AND config/experience-log.md first.
            profile.md has the author's voice/style rules (including an 'Anti-AI-detector rules'
            subsection — treat this as seriously as the banned-phrase list), tech pillars,
            writing-sample references, and draft file format. topics-queue.json has the rotating
            topic backlog per pillar plus 'used'/'rejected' history. experience-log.md is a
            running inbox of raw real-world material under its '## Unused' heading.

            0. HARD GATE — CHECK FIRST: get today's date (`date -u +%Y-%m-%d`). Look at
               experience-log.md's '## Unused' section for a bullet whose text starts with
               today's date (YYYY-MM-DD:). If NO such bullet exists, STOP HERE — do not pop any
               topic from topics-queue.json, do not draft anything, do not create a branch or PR.
               Just report back: "Skipped — no experience-log.md entry dated <today> under
               Unused." and end. Only proceed to step 1 if at least one today-dated entry exists
               (this gate is just an on/off switch for whether you draft today — it does not
               restrict which entry you use in step 3).

            1. PICK A TOPIC: choose whichever of the 5 pillars (architecture, devops_cloud,
               azure, dotnet, node_python) has gone longest without a 'used' entry (if 'used' is
               empty, rotate through them based on how many total used+rejected entries exist so
               far, cycling architecture, devops_cloud, azure, dotnet, node_python). Pop one
               topic string from that pillar's queue array in topics-queue.json — pick whichever
               entry in that pillar's list is most timely/interesting, not necessarily the first.

            2. REPLENISH IF LOW: if that pillar's queue array now has fewer than 3 items left,
               generate 5 new candidate topics for that pillar in the same spirit as the existing
               ones, cross-checked against all titles already in queue/used/rejected (any pillar)
               so nothing repeats, and append them to that pillar's queue array.

            3. GROUNDING MATERIAL: consider ALL entries currently in experience-log.md's
               '## Unused' section — not just today-dated ones; older un-used entries from
               previous days are equally fair game and should never just sit there unused. Pick
               whichever single entry (regardless of its date) best fits today's topic/pillar.
               Prefer today's entries when there's a close tie, but don't force a weaker fit just
               because it's newer. Also check profile.md's 'Concrete experience to draw on'
               section for anything additionally relevant. Note which entry you used, you'll need
               it in step 8.

            4. DRAFT THE ARTICLE: 800-1400 words, following profile.md's voice/style rules AND
               its anti-AI-detector rules exactly (deliberate sentence-length burstiness, no
               reflexive intro/three-points/conclusion shape, no perfectly-hedged both-sides
               framing, varied paragraph lengths). Avoid every phrase on the banned-phrase list.
               The article must contain at least one concrete, falsifiable claim (a number, a
               named pattern, a real trade-off) and take a clear side rather than hedging
               everything. Ground it specifically in the experience-log entry from step 3 —
               don't just mention it in passing, build the article's core argument around the
               real texture it gives you. If profile.md has real 'Writing samples' entries (not
               the placeholder), calibrate your sentence rhythm and voice against them.

            5. BANNED-PHRASE SELF-REVIEW: re-read your draft specifically hunting for anything on
               the banned-phrase list or generic AI-sounding filler; rewrite those spots.

            6. AI-DETECTOR SELF-CHECK: re-read the draft again, this time specifically hunting
               for detector-bait patterns — uniform sentence rhythm, generic paragraph
               transitions, mechanically clean structure, over-balanced arguments. Rewrite for
               burstiness and a distinct point of view wherever you find these. This is a
               separate pass from step 5 — do not skip it.

            7. ORIGINALITY SPOT-CHECK: pick the 2-3 most distinctive sentences from the final
               draft and use WebSearch on each (as an exact phrase) to check they don't return a
               verbatim match elsewhere online. If one does, rewrite that sentence.

            8. FILE IT: compute review_id as `<today's-date YYYY-MM-DD>-<short-kebab-slug-of-the-
               title>`. Write the topics-queue.json updates (the popped topic + any replenished
               topics) to disk. Move the experience-log.md entry you used in step 3 from
               '## Unused' to '## Referenced', appending " — used in <review_id>" to it. Write
               the article to drafts/<review_id>.md with YAML front-matter exactly matching the
               'Draft file format' section of profile.md (title, pillar, tags — up to 4, from
               profile.md's per-pillar tag defaults — review_id, date), followed by the article
               body.

            9. GIT + PR: set a bot identity for this commit (`git config user.name
               "architecture-journal-bot"` and `git config user.email
               "articles-bot@users.noreply.github.com"`). Create and check out a new branch named
               `draft/<review_id>` from main. Stage config/topics-queue.json,
               config/experience-log.md, and drafts/<review_id>.md, commit with a message like
               "Draft: <title>", and push the branch to origin. Then open a pull request using
               the gh CLI, base=main, head=draft/<review_id>, title = the article's title, and
               body containing: the pillar, the tags, an approximate word count, and this exact
               line: "Merge this PR to publish it to dev.to. Close it without merging to reject —
               leave a comment explaining why if you want future drafts to account for it."

            10. REPORT: end with a short summary — which pillar/topic you drafted, which
                experience-log entry grounded it, the review_id, and the PR URL (or, if PR
                creation failed, the pushed branch name and a note that it needs manual PR
                creation). Do not merge or close anything yourself — only the human reviewer does
                that.
